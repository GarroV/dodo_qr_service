# Локальная площадка проекта. Имя проекта compose задаётся снаружи:
#   docker compose -p meridius-<копия> up -d
# Без своего имени параллельные копии репозитория перехватывают контейнеры друг друга,
# а `down -v` сносит чужой том с базой.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    labels:
      # Ночной бэкап на площадке находит базы по этой метке (задача «PG Docker Backup»,
      # 03:30 → C:\backups, ретеншн 14 дней). Без метки база в бэкап не попадает вовсе.
      backup.pgdump: "true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dodo}
      POSTGRES_DB: ${POSTGRES_DB:-meridius}
    ports:
      # 5433 снаружи, чтобы не спорить с локальным PostgreSQL на 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dodo} -d ${POSTGRES_DB:-meridius}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
